name: Rust CI

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  test-matrix:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Release checklist (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\release\checklist.ps1
      - name: Release checklist (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/release/checklist.sh

  release-artifacts:
    name: Release artifacts (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal
      - name: Build release binary
        run: cargo build --release --locked
      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\release\package.ps1
      - name: Verify artifact checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\release\verify.ps1
      - name: Package artifact (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/release/package.sh
      - name: Verify artifact checksum (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/release/verify.sh
      - name: Package artifact (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/release/package.sh
      - name: Verify artifact checksum (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/release/verify.sh
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pasta-${{ matrix.os }}-release
          path: dist/*
