[package]
name = "pasta"
version = "1.6.1"
edition = "2021"
authors = ["Travis Garrison <brainboy2487@gmail.com>"]
description = "PASTA language core runtime and tooling (Rust)"
license = "MIT"
repository = ""
homepage = ""
documentation = ""

[lib]
path = "src/lib.rs"

[dependencies]
lazy_static = "1.4"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
anyhow = "1.0"
libc = "0.2"
x11 = { version = "2.3", features = ["xlib"], optional = true }
chrono = "0.4.44"
once_cell = "1.18"
image = { version = "0.24", optional = true }
walkdir = "2.3"
strsim = "0.10"
notify = { version = "6.1", optional = true }
path-clean = "0.1"
anymap = "0.12"

[features]
default = ["x11"]
x11 = ["dep:x11"]
scheduler = []
use_asm = []
canvas_png = ["image"]
modloader_dev = ["notify"]
typing = []

[dev-dependencies]
pretty_assertions = "1.3"
criterion = "0.4"
tempfile = "3.6"
assert_cmd = "2.0"

[workspace]
members = [
  "src/pasta_async"
]

[[bin]]
name = "pasta"
path = "src/bin/pasta.rs"
