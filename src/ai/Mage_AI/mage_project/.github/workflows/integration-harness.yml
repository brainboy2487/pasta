name: Integration Harness (manual)

on:
  workflow_dispatch: {}

jobs:
  integration-harness:
    name: Run integration harness (manual)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config

      - name: Build project
        run: |
          make -j2

      - name: Run integration harness
        run: |
          make integration-harness
